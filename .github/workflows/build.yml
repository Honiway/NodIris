name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cmake --install build/release --prefix dist --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: NodIris-${{ runner.os }}
          path: dist
